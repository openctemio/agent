name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.1, v0.1.1-staging)'
        required: true
        type: string
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

# Images are published as ghcr.io/openctemio/sensor (RFC-023 §9.5).
#
# The pre-rename images ghcr.io/openctemio/agent:* are FROZEN: this workflow
# never pushes to them again, and they must not be deleted or overwritten, so
# a pipeline pinned to an old tag keeps pulling exactly what it pulled
# before. (No new image is pushed under the old name either: a re-push would
# overwrite a tag a customer pinned.)
env:
  # Primary registry (GHCR - always available via GITHUB_TOKEN)
  IMAGE_NAME: ghcr.io/openctemio/sensor
  # Secondary registry (Docker Hub - optional)
  DH_IMAGE_NAME: openctemio/sensor

jobs:
  # ============================================
  # Prepare - Set build variables
  # ============================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      environment: ${{ steps.vars.outputs.ENVIRONMENT }}
      latest_suffix: ${{ steps.vars.outputs.LATEST_SUFFIX }}
      has_dockerhub: ${{ steps.check.outputs.HAS_DOCKERHUB }}
    steps:
      - name: Check Docker Hub credentials
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "HAS_DOCKERHUB=true" >> $GITHUB_OUTPUT
            echo "::notice::Docker Hub credentials found - will mirror to Docker Hub"
          else
            echo "HAS_DOCKERHUB=false" >> $GITHUB_OUTPUT
            echo "::notice::No Docker Hub credentials - publishing to GHCR only"
          fi

      - name: Validate version format
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format '$VERSION'. Must match v<major>.<minor>.<patch> (e.g., v0.1.0, v1.0.0-staging)"
            exit 1
          fi

      - name: Set build variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ "$VERSION" == *"-staging"* ]]; then
              ENVIRONMENT="staging"
            else
              ENVIRONMENT="production"
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT

          if [ "$ENVIRONMENT" = "staging" ]; then
            echo "LATEST_SUFFIX=staging-latest" >> $GITHUB_OUTPUT
          else
            echo "LATEST_SUFFIX=latest" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Build - Multi-arch builds for each variant
  # ============================================
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    needs: [prepare]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, ci, semgrep, trivy, nuclei, betterleaks]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image locally first and smoke-test it (every bundled tool
      # runs and the sensor reports it available). Nothing is pushed if a
      # tool is broken; the push below reuses this build's cache.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'ci') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          target: ${{ matrix.variant == 'ci' && 'ci' || '' }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Smoke test
        run: scripts/image-smoke-test.sh "${{ matrix.variant }}" "sensor-smoke:${{ matrix.variant }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'ci') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          # "ci" is the Dockerfile's ci stage (semgrep + betterleaks + trivy, runs
          # as root in /github/workspace), the image the CI templates use for a
          # full scan; every other variant builds its file's final stage.
          target: ${{ matrix.variant == 'ci' && 'ci' || '' }}
          platforms: ${{ matrix.platform }}
          # Stamped into the binary (-X main.Version); without it every
          # published image reported "OpenCTEM Sensor version dev".
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # Merge - Create multi-platform manifests on GHCR
  # ============================================
  merge:
    name: Merge ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, ci, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and push
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          TAG_ARGS="-t ${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT} -t ${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}"
          # The default image is also the plain tag (sensor:v0.4.2, sensor:latest);
          # the -default names stay for existing pulls.
          if [ "$VARIANT" = default ]; then
            TAG_ARGS="$TAG_ARGS -t ${{ env.IMAGE_NAME }}:${VERSION} -t ${{ env.IMAGE_NAME }}:${LATEST}"
          fi

          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Generate build summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          echo "### ${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          if [ "$VARIANT" = default ]; then
            echo "${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.IMAGE_NAME }}:${LATEST}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Mirror to Docker Hub (optional)
  # ============================================
  mirror-to-dockerhub:
    name: Mirror ${{ matrix.variant }} to Docker Hub
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: needs.prepare.outputs.has_dockerhub == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [default, ci, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"

          echo "Copying ${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT} -> ${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}"
          crane copy "${{ env.IMAGE_NAME }}:${VERSION}-${VARIANT}" "${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}"

          echo "Copying ${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT} -> ${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}"
          crane copy "${{ env.IMAGE_NAME }}:${LATEST}-${VARIANT}" "${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}"

          if [ "$VARIANT" = default ]; then
            crane copy "${{ env.IMAGE_NAME }}:${VERSION}" "${{ env.DH_IMAGE_NAME }}:${VERSION}"
            crane copy "${{ env.IMAGE_NAME }}:${LATEST}" "${{ env.DH_IMAGE_NAME }}:${LATEST}"
          fi

      - name: Generate Docker Hub summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          LATEST="${{ needs.prepare.outputs.latest_suffix }}"
          echo "### ${VARIANT} (Docker Hub)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DH_IMAGE_NAME }}:${VERSION}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DH_IMAGE_NAME }}:${LATEST}-${VARIANT}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
