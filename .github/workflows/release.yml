name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless signing of checksums.txt (goreleaser signs: cosign sign-blob).
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 - notes.md <<'PY'
          import re, sys
          path = sys.argv[1]
          text = re.sub(r" ?<[^<>\s]+@[^<>\s]+>", "", open(path).read())
          mention = re.compile(r"(?<![\w`/.@-])(?<!by )(?<!\* )@[A-Za-z0-9][\w-]*(?:/[\w.-]+)?(?:@[\w.^~-]+)?")
          parts = re.split(r"(`[^`]*`)", text)
          text = "".join(p if p.startswith("`") else mention.sub(lambda m: "`" + m.group(0) + "`", p) for p in parts)
          open(path, "w").write(text)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
