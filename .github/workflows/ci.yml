name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      # platform.go and its tests are behind the `platform` build tag, so the
      # plain run above never compiles or tests platform mode.
      - name: Run platform-mode tests
        run: go test -v -race -tags platform ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned (was latest) — avoid CI-breaking tool drift
          version: v2.13.1

      - name: Run golangci-lint (platform mode)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --build-tags platform

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build
        run: |
          go build -v -o openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openctemio-sensor-${{ matrix.goos }}-${{ matrix.goarch }}
