name: Image Smoke Test

# Builds every published image variant and runs scripts/image-smoke-test.sh:
# each bundled tool must run and the sensor must report it available. The
# v0.3.0 images shipped a semgrep that died on import (pkg_resources), and
# the sensor skipped it silently; this catches that class before release.
# docker-publish.yml runs the same test before it pushes a tag's images.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - 'scripts/image-smoke-test.sh'
      - '.github/workflows/image-smoke.yml'
      - '.github/workflows/docker-publish.yml'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'tool_status.go'
      - 'internal/tools/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, ci, semgrep, trivy, nuclei, betterleaks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: .
          # Same file/target selection as docker-publish.yml.
          file: ${{ (matrix.variant == 'default' || matrix.variant == 'ci') && 'Dockerfile' || format('Dockerfile.{0}', matrix.variant) }}
          target: ${{ matrix.variant == 'ci' && 'ci' || '' }}
          platforms: linux/amd64
          load: true
          tags: sensor-smoke:${{ matrix.variant }}
          provenance: false
          sbom: false

      - name: Smoke test
        run: scripts/image-smoke-test.sh "${{ matrix.variant }}" "sensor-smoke:${{ matrix.variant }}"
