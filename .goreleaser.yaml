# GoReleaser configuration for the OpenCTEM sensor
# Documentation: https://goreleaser.com
#
# Local testing:
#   goreleaser check                    # Validate config
#   goreleaser build --snapshot --clean # Build without publishing
#   goreleaser release --snapshot --clean # Full release simulation

version: 2

project_name: openctemio-sensor

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: openctemio-sensor
    main: .
    binary: openctemio-sensor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows ARM64 is not commonly used
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - typo
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Security Updates"
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: openctemio
    # The repository keeps its name until its owner renames it (GitHub then
    # redirects); only the binary, archives and images are renamed.
    name: agent
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## OpenCTEM Sensor v{{.Version}}

    Security scanning sensor for the OpenCTEM platform (binary `openctemio-sensor`,
    formerly `agent`). Settings from the agent releases keep working: `AGENT_*`
    variables, `-agent-id` and the `agent:` config block are read with a
    deprecation warning, and `~/.openctem/agent-credentials.json` is moved to
    `~/.openctem/sensor-credentials.json` on first start.

    ### Installation

    **Linux/macOS (amd64):**
    ```bash
    curl -sSL https://github.com/openctemio/sensor/releases/download/v{{.Version}}/openctemio-sensor_{{.Version}}_linux_amd64.tar.gz | tar xz
    chmod +x openctemio-sensor
    sudo mv openctemio-sensor /usr/local/bin/
    ```

    **Linux (arm64):**
    ```bash
    curl -sSL https://github.com/openctemio/sensor/releases/download/v{{.Version}}/openctemio-sensor_{{.Version}}_linux_arm64.tar.gz | tar xz
    chmod +x openctemio-sensor
    sudo mv openctemio-sensor /usr/local/bin/
    ```

    **macOS (Apple Silicon):**
    ```bash
    curl -sSL https://github.com/openctemio/sensor/releases/download/v{{.Version}}/openctemio-sensor_{{.Version}}_darwin_arm64.tar.gz | tar xz
    chmod +x openctemio-sensor
    sudo mv openctemio-sensor /usr/local/bin/
    ```

    **Windows:**
    Download `openctemio-sensor_{{.Version}}_windows_amd64.zip` and extract to your PATH.

    **Docker (GHCR - primary):**
    ```bash
    # Available variants: default, semgrep, trivy, nuclei, gitleaks
    docker pull ghcr.io/openctemio/sensor:v{{.Version}}-default
    docker pull ghcr.io/openctemio/sensor:v{{.Version}}-semgrep
    docker pull ghcr.io/openctemio/sensor:v{{.Version}}-trivy
    docker pull ghcr.io/openctemio/sensor:v{{.Version}}-nuclei
    docker pull ghcr.io/openctemio/sensor:v{{.Version}}-gitleaks
    ```

    **Docker (Docker Hub mirror):**
    ```bash
    docker pull openctemio/sensor:v{{.Version}}-default
    ```

    ### Verify Checksum
    ```bash
    sha256sum -c checksums.txt
    ```

  footer: |
    ---
    **Full Changelog**: https://github.com/openctemio/sensor/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Docker Images:** [GHCR](https://github.com/openctemio/sensor/pkgs/container/sensor).
    The `ghcr.io/openctemio/agent:*` images are frozen at their last release:
    still pullable, never updated.

